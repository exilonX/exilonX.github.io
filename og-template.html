<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Image Template — Ionel Merca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: 1200px;
      height: 630px;
      background: #0a0e1a;
      color: #f0f4f9;
      padding: 80px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    /* Subtle dot grid */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Glow orbs */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
    }
    .glow-1 {
      background: #3b82f6;
      opacity: 0.30;
      width: 480px; height: 480px;
      top: -120px; left: -140px;
    }
    .glow-2 {
      background: #a855f7;
      opacity: 0.25;
      width: 380px; height: 380px;
      bottom: -80px; right: -80px;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .top {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .available {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.30);
      border-radius: 999px;
      font-size: 18px;
      color: #10b981;
      font-weight: 500;
      align-self: flex-start;
    }
    .available::before {
      content: '';
      width: 8px; height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
    }

    .name {
      font-size: 110px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 0;
      background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .role {
      font-size: 34px;
      font-weight: 500;
      color: #cbd5e1;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .bottom {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 20px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #64748b;
      font-size: 22px;
    }
    .footer .domain {
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .footer .location {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="content">
      <div class="top">
        <div class="available">Available for contract work</div>
        <h1 class="name">Ionel Merca</h1>
        <p class="role">Backend Engineer · Node.js Microservices, Distributed Systems</p>
      </div>

      <div class="bottom">
        <div class="pills">
          <span class="pill">Node.js</span>
          <span class="pill">Microservices</span>
          <span class="pill">Kafka</span>
          <span class="pill">TypeScript</span>
          <span class="pill">Distributed Systems</span>
          <span class="pill">Payments &amp; Identity</span>
        </div>
        <div class="footer">
          <span class="location">Bucharest, Romania · 10+ years in production</span>
          <span class="domain">exilonx.github.io</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
