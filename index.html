    <!-- The body is prerendered, but .fade-in starts at opacity:0 and only gets

    <!-- SPA redirect decoder: companion to public/404.html. Restores deep-link URLs after GitHub Pages
         404→index redirect, so https://ionelmerca.com/case-study/foo loads cleanly. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
